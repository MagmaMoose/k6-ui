suites:
  - id: http
    label: HTTP
    note: Requests the target without signing in.
    include: ["*.js"]
    target: BASE_URL
environments:
  - name: dev
    label: Development
    secret: loadtest-dev
    suites: [http]
    targets:
      http: https://app.dev.example.com
    allowed_hosts: ["*.dev.example.com"]
    grafana_url: https://grafana.example.com
    defaults:
      vus: 20
      parallelism: 1
      ramp: 30s
      duration: 2m
      ramp_down: 20s
  - name: external-test
    label: External test environment
    secret: loadtest-external
    suites: [http]
    targets:
      http: https://test.example.net
    allowed_hosts: [test.example.net]
    groups: ["oidc:qa"]
    grafana_url: https://grafana.example.com
