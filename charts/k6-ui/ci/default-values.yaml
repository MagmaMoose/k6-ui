azure:
  tenantId: 11111111-1111-1111-1111-111111111111
  clientId: 22222222-2222-2222-2222-222222222222
config:
  publicOrigin: https://loadtest.example.com
catalog:
  content:
    tests:
    - id: smoke
      label: HTTP smoke
      description: Send requests to the configured target and check its response time.
      script: smoke.js
    environments:
    - name: dev
      label: Development
      secret: loadtest-dev
      tests:
      - smoke
      grafana_url: https://grafana.example.com
      defaults:
        vus: 20
        parallelism: 1
        ramp: 30s
        duration: 2m
        ramp_down: 20s
    - name: external-test
      label: External test environment
      secret: loadtest-external
      tests:
      - smoke
      groups:
      - oidc:qa
      grafana_url: https://grafana.example.com
